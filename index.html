<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小夜｜電子實測日記</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="打了三小時，你知道自己是贏是輸嗎？">
<meta property="og:description" content="免費算給你看：淨利、回本距離、最大回撤。">
<meta property="og:image" content="hero.webp">
<link rel="preload" as="image" href="hero.webp">
<style>
  html,body{margin:0;padding:0;background:#0B0512}
  /* 圖是唯一的版面。CTA 是疊在圖上的透明感應區，
     不另外畫按鈕——按鈕長什麼樣由圖決定。 */
  .stage{position:relative;display:block;max-width:560px;margin:0 auto;
         -webkit-tap-highlight-color:transparent}
  .stage img{width:100%;height:auto;display:block}
  .hit{position:absolute;display:block;text-indent:-9999px;overflow:hidden;
       background:transparent}
  /* 除錯用：網址加 ?hit=1 會把感應區塗紅，方便對座標 */
  body.dbg .hit{background:rgba(255,0,0,.35)}
</style>
</head>
<body>

<div class="stage">
  <img src="hero.webp" alt="打了三小時，你知道自己是贏是輸嗎？免費算給你看：淨利、回本距離、最大回撤。">
  <a class="hit" id="reg"  href="#">立即註冊</a>
  <a class="hit" id="line" href="#">加入 LINE 領解鎖碼</a>
</div>

<script>
/* ═══ 設定區：只改這一段 ═══════════════════════════════

   HIT 的四個數字都是「佔整張圖的百分比」，不是像素。
   這樣換圖、換手機尺寸都不用重算——只要按鈕在圖上的相對位置沒變。

   量法：用任何看圖軟體開 hero.webp，看按鈕的四個角在整張圖的幾 %。
   例：圖高 1920，按鈕上緣在 1660 → top = 1660/1920 = 86.5

   對不準的話，網址後面加 ?hit=1，感應區會塗紅色，一眼看出差多少。   */

var CFG = {
  GA4_ID:        'G-DET0P0309V',        // qwe11a3.site 專屬資料串流「喵喵落地頁」（2026-08-17 建）
  /* Meta Pixel「XY-001」（2026-08-17 加）。只有喵喵這頁有，M3 那頁沒裝。
     🔴 這裡只放 Pixel ID——它本來就是公開的。
        CAPI 的 access token 絕對不能放這裡，網頁原始碼任何人都看得到。
        token 存在 Cloudflare 密鑰，由 /api/capi 那支代發。 */
  META_PIXEL_ID: '1664265594800673',
  CAPI_URL:      'https://ys89-seo-dashboard.pages.dev/api/capi',

  /* 🔴 代理碼。平台後台只認這個參數，填錯整本帳就歪了。
     zspxbd = fu009 廣告線・喵喵（原本掛 ys89.tw，那站三個月 0 首存，已併入 fu002）
     對照表：.claude/skills/paid-acquisition/data/proxy_map.json */
  PROXY: 'zspxbd',                      // fu009（原 ys89.tw，2026-08-17 改為廣告線・喵喵）

  /* 🔴 LINE 那顆用 oaMessage 連結：點下去會自動把 STAMP 這句話
     填進他的訊息欄，他按送出，機器人收到就知道他是廣告來的，
     之後發的解鎖連結、圖文選單、註冊按鈕全部換成廣告代理碼。
     這串字要跟 seth-unlock-bot/worker.js 的 AD_STAMP_MIAO 一字不差。
     🔴 版面、圖片、按鈕位置都必須跟 M3 那頁完全一樣——這波要測的是
        「哪家廣告商投得好」，頁面也不同的話，結果分不出是廣告商還是頁面的差別。 */
  OA:    '@806ugpjh',
  STAMP: '我要領解鎖碼',                 // 🔴 跟 M3 那頁差一個「領」字，機器人靠這個分辨是哪一家

  /* 喵喵專屬加入好友管道（管道 喵喵廣告／來源 qwe11a3落地頁／活動 2026-08_賽特工具）。
     M3 那頁用的是另一條 lin.ee/YGpUESx，兩家在 LINE 後台各自一行。
     手機沒裝 LINE、或 oaMessage 沒跳走時的退路，也是 LINE 後台分流量的依據。 */
  ADD_LINE: 'https://lin.ee/o5bwBAW',

  /* 感應區座標（%）：top / left / width / height */
  /* 2026-08-17 對應 hero.webp（941×1672）：
     加 LINE 那條白底約在 y 1400–1500、x 85–830
     註冊領取那條金底約在 y 1530–1650、x 30–915
     兩塊刻意各留一點餘裕，手指按得到；但不能重疊，重疊會誤觸。 */
  HIT: {
    line: { top: 83.0, left: 7.0, width: 84.0, height: 7.5 },   // 加 LINE 領解鎖碼
    reg:  { top: 90.8, left: 2.5, width: 95.0, height: 8.5 }    // 註冊領取
  },

  DEFAULT_SRC: 'lp-v3b-miao'
};
/* ═══════════════════════════════════════════════════ */

(function () {
  var qs  = new URLSearchParams(location.search);
  var src = qs.get('src') || qs.get('utm_source') || CFG.DEFAULT_SRC;
  var kw  = (qs.get('utm_content') || qs.get('ad') || 'lp3').replace(/[^\w-]/g, '').slice(0, 40);
  try { localStorage.setItem('ys_src', src); } catch (e) {}

  if (qs.get('hit')) document.body.classList.add('dbg');

  function place(el, r) {
    el.style.top = r.top + '%'; el.style.left = r.left + '%';
    el.style.width = r.width + '%'; el.style.height = r.height + '%';
  }
  var reg = document.getElementById('reg'), line = document.getElementById('line');
  place(reg, CFG.HIT.reg); place(line, CFG.HIT.line);

  reg.href = 'https://ys89.bet/activity/entry?url=/activity/detail/RegistrationBonus/NTD'
    + '&proxy=' + CFG.PROXY
    + '&utm_source=' + encodeURIComponent(src)
    + '&utm_medium=cpc&utm_campaign=seth&utm_content=' + kw;

  /* 🔴 oaMessage（自動填好一句話）只有在手機、而且裝了 LINE 才會生效。
     桌機瀏覽器點下去會落到 LINE 官網首頁——2026-08-17 實測踩到。
     所以桌機直接給一般的加好友連結，不要給他一個壞掉的按鈕；
     手機才用 oaMessage，並且留一個 1.6 秒的保險：沒跳走就改用一般連結。 */
  /* 廣告專屬的「加入好友管道」（管道 小夜廣告／來源 pgctvwer落地頁／活動 2026-08_賽特工具）。
     用這條加進來的好友，LINE 後台的「分析→好友→新增管道」會單獨列一行，
     所以就算個人層級的蓋章漏掉了，總數還是分得出是廣告帶來的。 */
  var ADD_URL = CFG.ADD_LINE || ('https://line.me/R/ti/p/' + encodeURIComponent(CFG.OA));
  var MSG_URL = 'https://line.me/R/oaMessage/' + encodeURIComponent(CFG.OA)
              + '/?' + encodeURIComponent(CFG.STAMP);
  var isMobile = /iphone|ipad|ipod|android/i.test(navigator.userAgent);

  line.href = isMobile ? MSG_URL : ADD_URL;
  if (isMobile) {
    line.addEventListener('click', function () {
      var left = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) left = true;
      }, { once: true });
      setTimeout(function () { if (!left) location.href = ADD_URL; }, 1600);
    });
  }

  /* 事件同時走兩條：瀏覽器 Pixel ＋ 伺服器 CAPI。
     🔴 兩邊要帶同一個 event_id，Meta 才知道是同一次事件、不會重複計算。
        少了它，一次點擊會被算成兩次，成效看起來憑空多一倍。 */
  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function track(name, standard) {
    const eid = newId();
    if (window.gtag) gtag('event', name, { campaign_source: src, ad_content: kw });
    if (window.fbq) {
      if (standard) fbq('track', standard, { content_name: name }, { eventID: eid });
      else fbq('trackCustom', name, { src: src, content: kw }, { eventID: eid });
    }
    if (CFG.CAPI_URL) {
      /* keepalive：使用者按下按鈕後頁面馬上跳走，一般的 fetch 會被中斷。 */
      fetch(CFG.CAPI_URL, {
        method: 'POST', keepalive: true,
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          pixel_id: CFG.META_PIXEL_ID, event_name: standard || name, event_id: eid,
          event_source_url: location.href, src: src, content: kw,
          fbp: (document.cookie.match(/_fbp=([^;]+)/) || [])[1] || '',
          fbc: (document.cookie.match(/_fbc=([^;]+)/) || [])[1] || '',
        }),
      }).catch(() => {});
    }
  }
  /* 註冊按鈕對應 Meta 的標準事件 Lead——標準事件才能拿來最佳化投放，
     自訂事件只能看報表。 */
  reg.addEventListener('click',  function () { track('lp_click_register', 'Lead'); });
  line.addEventListener('click', function () { track('lp_click_line', 'Contact'); });

  if (CFG.GA4_ID) {
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + CFG.GA4_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', CFG.GA4_ID, { campaign_source: src });
  }

  if (CFG.META_PIXEL_ID) {
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', CFG.META_PIXEL_ID);
    var pvId = newId();
    fbq('track', 'PageView', {}, { eventID: pvId });
    if (CFG.CAPI_URL) {
      fetch(CFG.CAPI_URL, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pixel_id: CFG.META_PIXEL_ID, event_name: 'PageView',
          event_id: pvId, event_source_url: location.href, src: src, content: kw,
          fbp: (document.cookie.match(/_fbp=([^;]+)/) || [])[1] || '',
          fbc: (document.cookie.match(/_fbc=([^;]+)/) || [])[1] || '' }) }).catch(() => {});
    }
  }
})();
</script>
</body>
</html>
