<style>
  :root{
    --green:#06C755;
    --green-deep:#04913E;
    --ink:#0B3D22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    background:var(--green);
    color:#fff;
    font-family:"PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
    line-height:1.7;
    display:flex;
    justify-content:center;
    padding:32px 20px 48px;
  }
  .wrap{width:100%;max-width:420px;text-align:center}

  .avatar{
    width:150px;height:150px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgba(255,255,255,.9);
    margin:0 auto 20px;
    display:block;
  }
  .name{font-size:15px;letter-spacing:.16em;opacity:.9;margin-bottom:10px}

  h1{
    font-size:29px;
    font-weight:800;
    line-height:1.45;
    letter-spacing:.01em;
    margin-bottom:18px;
  }
  h1 em{font-style:normal;display:block;font-size:20px;font-weight:600;opacity:.92;margin-top:8px}

  .lead{font-size:17px;opacity:.95;margin-bottom:28px}

  .card{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    border-radius:16px;
    padding:20px 18px;
    text-align:left;
    margin-bottom:30px;
  }
  .card h2{font-size:16px;font-weight:700;margin-bottom:12px;letter-spacing:.02em}
  .card ul{list-style:none}
  .card li{position:relative;padding-left:22px;font-size:15.5px;margin-bottom:8px}
  .card li:last-child{margin-bottom:0}
  .card li::before{
    content:"";position:absolute;left:4px;top:11px;
    width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85;
  }

  .cta{
    display:block;
    background:#fff;
    color:var(--green-deep);
    font-size:20px;
    font-weight:800;
    letter-spacing:.03em;
    text-decoration:none;
    padding:18px 20px;
    border-radius:999px;
    box-shadow:0 8px 22px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{transform:translateY(2px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .cta-sub{font-size:13.5px;opacity:.85;margin-top:12px}

  .note{
    margin-top:34px;
    font-size:12.5px;
    line-height:1.75;
    opacity:.78;
    border-top:1px solid rgba(255,255,255,.25);
    padding-top:16px;
    text-align:left;
  }

  @media (max-width:360px){
    h1{font-size:25px}
    .cta{font-size:18px}
  }
</style>
