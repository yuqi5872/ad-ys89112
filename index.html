<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小夜｜電子實測日記</title>
<meta name="description" content="我把每一場的本金、注額、餘額都寫下來。加 LINE 一起交流。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="小夜｜電子實測日記">
<meta property="og:description" content="我把每一場的本金、注額、餘額都寫下來。加 LINE 一起交流。">
<meta property="og:image" content="xiaoye.webp">
<meta property="og:type" content="website">
<style>
  :root{
    --green:#06C755;
    --green-deep:#04913E;
    --ink:#0B3D22;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    background:var(--green);
    color:#fff;
    font-family:"PingFang TC","Noto Sans TC","Heiti TC",system-ui,sans-serif;
    line-height:1.7;
    display:flex;
    justify-content:center;
    padding:32px 20px 48px;
  }
  .wrap{width:100%;max-width:420px;text-align:center}

  .avatar{
    width:150px;height:150px;
    border-radius:50%;
    object-fit:cover;
    object-position:50% 8%;
    border:4px solid rgba(255,255,255,.9);
    margin:0 auto 20px;
    display:block;
  }
  .name{font-size:15px;letter-spacing:.16em;opacity:.9;margin-bottom:10px}

  h1{
    font-size:29px;
    font-weight:800;
    line-height:1.45;
    letter-spacing:.01em;
    margin-bottom:18px;
  }
  h1 em{font-style:normal;display:block;font-size:20px;font-weight:600;opacity:.92;margin-top:8px}

  .lead{font-size:17px;opacity:.95;margin-bottom:28px}

  .card{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    border-radius:16px;
    padding:20px 18px;
    text-align:left;
    margin-bottom:30px;
  }
  .card h2{font-size:16px;font-weight:700;margin-bottom:12px;letter-spacing:.02em}
  .card ul{list-style:none}
  .card li{position:relative;padding-left:22px;font-size:15.5px;margin-bottom:8px}
  .card li:last-child{margin-bottom:0}
  .card li::before{
    content:"";position:absolute;left:4px;top:11px;
    width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85;
  }

  .cta{
    display:block;
    background:#fff;
    color:var(--green-deep);
    font-size:20px;
    font-weight:800;
    letter-spacing:.03em;
    text-decoration:none;
    padding:18px 20px;
    border-radius:999px;
    box-shadow:0 8px 22px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{transform:translateY(2px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .cta-sub{font-size:13.5px;opacity:.85;margin-top:12px}

  .note{
    margin-top:34px;
    font-size:12.5px;
    line-height:1.75;
    opacity:.78;
    border-top:1px solid rgba(255,255,255,.25);
    padding-top:16px;
    text-align:left;
  }

  @media (max-width:360px){
    h1{font-size:25px}
    .cta{font-size:18px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <img class="avatar" src="xiaoye.webp" alt="小夜">
    <p class="name">小 夜 ｜ 電 子 實 測 日 記</p>

    <h1>
      我不報明牌
      <em>我只把自己的數字算清楚</em>
    </h1>

    <p class="lead">
      以前我也是憑手感換台。後來每一場都寫下來，才發現跟我原本以為的差很多。
    </p>

    <section class="card">
      <h2>我自己在用的工具</h2>
      <ul>
        <li>輸入本金、注額、目前餘額</li>
        <li>算出淨利、回本距離、最大回撤</li>
        <li>不預測下一局，也不告訴你何時進場</li>
      </ul>
    </section>

    <a class="cta" href="https://line.me/R/ti/p/%40128zirab" rel="noopener">加 LINE 一起交流 →</a>
    <p class="cta-sub">點下去直接開啟 LINE，我本人會回</p>

    <p class="note">
      小夜是合作代理，不是中立第三方，被問我就講。這裡的紀錄都是我自己的，樣本不大，不代表所有人的結果。
      工具算的是你自己輸入的數字，不預測結果、不保證獲利。
    </p>
  </main>
</body>
</html>
